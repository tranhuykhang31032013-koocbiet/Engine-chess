name: Stockfish Ultimate Duel

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Thời lượng đấu thực tế theo phút (10p -> 300p, không tính thời gian build PGO)'
        required: true
        default: '60p (60 Minutes - 1h)'
        type: choice
        options:
          - '10p (10 Minutes)'
          - '15p (15 Minutes)'
          - '20p (20 Minutes)'
          - '30p (30 Minutes)'
          - '45p (45 Minutes)'
          - '60p (60 Minutes - 1h)'
          - '90p (90 Minutes - 1.5h)'
          - '120p (120 Minutes - 2h)'
          - '150p (150 Minutes - 2.5h)'
          - '180p (180 Minutes - 3h)'
          - '210p (210 Minutes - 3.5h)'
          - '240p (240 Minutes - 4h)'
          - '270p (270 Minutes - 4.5h)'
          - '300p (300 Minutes - 5h)'
      concurrency:
        description: 'Số bàn cờ chạy song song đồng thời trên CPU đa nhân (Ghim nhân CPU Affinity + 100% tài nguyên/Engine)'
        required: true
        default: 'Auto-Optimal (Tự động tối ưu số bàn & ghim nhân CPU theo Threads)'
        type: choice
        options:
          - 'Auto-Optimal (Tự động tối ưu số bàn & ghim nhân CPU theo Threads)'
          - '4 Boards (Parallel 4x - Max 4 vCPU Throughput)'
          - '3 Boards (Parallel 3x)'
          - '2 Boards (Parallel 2x - Best for 2 Threads Leapfrog SMP)'
          - '1 Board (Sequential 1x - Best for 4 Threads Max SMP)'
      threads:
        description: 'Số luồng tìm kiếm UCI Threads cấp riêng cho TỪNG Engine (Khai thác Leapfrog SMP)'
        required: true
        default: '2 Threads per Engine (Leapfrog SMP 2-Core)'
        type: choice
        options:
          - '1 Thread per Engine (Standard Single-Core)'
          - '2 Threads per Engine (Leapfrog SMP 2-Core)'
          - '4 Threads per Engine (Max 4-Core Leapfrog SMP)'
      hash:
        description: 'Dung lượng bộ nhớ Hash cấp riêng cho TỪNG Engine (Hỗ trợ Linux 2MB HugePages trên 16GB RAM)'
        required: true
        default: '512 MB'
        type: choice
        options:
          - '128 MB'
          - '256 MB'
          - '512 MB'
          - '1024 MB'
          - '2048 MB'
      move_time:
        description: 'Thời gian suy nghĩ mỗi nước cấp cho từng Engine (Move Time)'
        required: true
        default: '500 ms'
        type: choice
        options:
          - '100 ms'
          - '200 ms'
          - '500 ms'
          - '1000 ms'
          - '2000 ms'

permissions:
  contents: read

env:
  PRO_GDRIVE_ID: '1KMZGR927eodz7f7SbeAF3rQrABQoNo1W'
  PRO_GDRIVE_URL: 'https://drive.google.com/file/d/1KMZGR927eodz7f7SbeAF3rQrABQoNo1W/view?usp=drivesdk'
  UNI_GDRIVE_ID: '1vbj9fK4iCrBFWzGACOMNJFBWBpaHHL7l'
  UNI_GDRIVE_URL: 'https://drive.google.com/file/d/1vbj9fK4iCrBFWzGACOMNJFBWBpaHHL7l/view?usp=drivesdk'
  USE_PGO: 'true'

jobs:
  stage1_tournament:
    name: "Stage 1 — Max Hardware Tuning, PGO Build & Multi-Core Duel (Up to 180p)"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 225
    outputs:
      needs_stage2: ${{ steps.plan.outputs.needs_stage2 }}
      duration_minutes: ${{ steps.plan.outputs.duration_minutes }}
      stage1_minutes: ${{ steps.plan.outputs.stage1_minutes }}
      stage2_minutes: ${{ steps.plan.outputs.stage2_minutes }}
      duration_hours: ${{ steps.plan.outputs.duration_hours }}
      stage1_hours: ${{ steps.plan.outputs.stage1_hours }}
      stage2_hours: ${{ steps.plan.outputs.stage2_hours }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tune Linux Kernel Hardware (2MB HugePages, THP=always, CPU Governor=performance)
        run: |
          sudo sh -c 'echo always > /sys/kernel/mm/transparent_hugepage/enabled' 2>/dev/null || true
          sudo sh -c 'echo madvise > /sys/kernel/mm/transparent_hugepage/defrag' 2>/dev/null || true
          sudo sysctl -w vm.overcommit_memory=1 >/dev/null 2>&1 || true
          sudo sysctl -w vm.swappiness=5 >/dev/null 2>&1 || true
          sudo sysctl -w kernel.sched_autogroup_enabled=0 >/dev/null 2>&1 || true
          for gov in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            if [ -e "$gov" ]; then
              echo performance | sudo tee "$gov" >/dev/null 2>&1 || true
            fi
          done
          echo "[HW-KERNEL] Transparent Huge Pages: $(cat /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null || echo N/A)"
          lscpu || true
          free -m || true

      - name: Unpack Duel Logic Archive from Root (duel-logic.zip)
        run: |
          python3 - << 'PYEOF'
          import glob, os, stat, tarfile, zipfile
          candidates = [
              "duel-logic.zip",
              "Stockfish-Ultimate-Duel-Logic.zip",
              "Stockfish-Ultimate-Duel-GitHub-Actions.zip",
              "duel-logic.tar.gz",
          ]
          for pattern in ("*logic*.zip", "*duel*.zip", "*Duel*.zip", "*logic*.tar.gz"):
              for m in sorted(glob.glob(pattern)):
                  if m not in candidates:
                      candidates.append(m)
          for archive in candidates:
              if os.path.isfile(archive):
                  print(f"[UNPACK] Đang giải nén gói logic '{archive}' tại thư mục gốc...")
                  if archive.endswith(".zip"):
                      with zipfile.ZipFile(archive, "r") as zf:
                          zf.extractall(".")
                  elif archive.endswith(".tar.gz") or archive.endswith(".tgz"):
                      with tarfile.open(archive, "r:gz") as tf:
                          tf.extractall(".")
                  break
          for fpath in glob.glob("scripts/*.sh") + glob.glob("scripts/*.py") + glob.glob("tests/*.py"):
              if os.path.isfile(fpath):
                  os.chmod(fpath, os.stat(fpath).st_mode | stat.S_IEXEC | stat.S_IXGRP | stat.S_IXOTH)
          if not os.path.isfile("scripts/tournament.py") or not os.path.isfile("scripts/build_engines.sh"):
              raise SystemExit("[ERROR] Không tìm thấy scripts/tournament.py hoặc scripts/build_engines.sh! Hãy upload duel-logic.zip ở thư mục gốc của repository.")
          print("[UNPACK] Đã giải nén thành công bộ logic điều phối giải đấu.")
          PYEOF

      - name: Install Python Dependencies (python-chess, PyYAML, gdown)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Compute Stage Plan (10p-180p Single Stage vs 181p-300p Two Stages)
        id: plan
        run: |
          python3 scripts/tournament.py --plan-stages --duration "${{ inputs.duration }}"

      - name: Download Engines from Google Drive, Verify Provenance & PGO Build Both Engines
        run: |
          chmod +x scripts/build_engines.sh
          ./scripts/build_engines.sh

      - name: Run Unit & Sanity Tests Before Tournament
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Multi-Core Hardware-Pinned Tournament — Stage 1 (${{ steps.plan.outputs.stage1_minutes }}p Play Time)
        run: |
          python3 scripts/tournament.py \
            --stage 1 \
            --pro-bin build/bin/stockfish-pro \
            --uni-bin build/bin/stockfish-universal \
            --results-dir results \
            --manifest results/build-manifest.json \
            --duration "${{ inputs.duration }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --move-time "${{ inputs.move_time }}" \
            --hash "${{ inputs.hash }}" \
            --threads "${{ inputs.threads }}"

      - name: Publish Stage 1 Summary to GitHub Step Summary
        if: always()
        run: |
          if [ -f results/summary.md ]; then
            cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Stage 1 Checkpoint & Binaries (For Stage 2 Resume / Recovery)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stockfish-Ultimate-Duel-Checkpoint-Stage1
          retention-days: 30
          if-no-files-found: warn
          path: |
            results/
            build/bin/

      - name: Upload Final Results Artifact (When 10p-180p Selected or Stage 1 Halted)
        if: always() && (steps.plan.outputs.needs_stage2 != 'true' || failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: Stockfish-Ultimate-Duel-Results
          retention-days: 30
          if-no-files-found: error
          path: |
            results/matches.log
            results/matches.pgn
            results/matches.csv
            results/matches.jsonl
            results/summary.json
            results/summary.md
            results/build-manifest.json
            results/checkpoint.json
            results/experience.bin

  stage2_tournament:
    name: "Stage 2 — Resume & Complete Remaining Multi-Core Duel (181p-300p)"
    needs: stage1_tournament
    if: needs.stage1_tournament.outputs.needs_stage2 == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 225

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tune Linux Kernel Hardware (2MB HugePages, THP=always, CPU Governor=performance)
        run: |
          sudo sh -c 'echo always > /sys/kernel/mm/transparent_hugepage/enabled' 2>/dev/null || true
          sudo sh -c 'echo madvise > /sys/kernel/mm/transparent_hugepage/defrag' 2>/dev/null || true
          sudo sysctl -w vm.overcommit_memory=1 >/dev/null 2>&1 || true
          sudo sysctl -w vm.swappiness=5 >/dev/null 2>&1 || true
          sudo sysctl -w kernel.sched_autogroup_enabled=0 >/dev/null 2>&1 || true

      - name: Unpack Duel Logic Archive from Root (duel-logic.zip)
        run: |
          python3 - << 'PYEOF'
          import glob, os, stat, tarfile, zipfile
          candidates = [
              "duel-logic.zip",
              "Stockfish-Ultimate-Duel-Logic.zip",
              "Stockfish-Ultimate-Duel-GitHub-Actions.zip",
              "duel-logic.tar.gz",
          ]
          for pattern in ("*logic*.zip", "*duel*.zip", "*Duel*.zip", "*logic*.tar.gz"):
              for m in sorted(glob.glob(pattern)):
                  if m not in candidates:
                      candidates.append(m)
          for archive in candidates:
              if os.path.isfile(archive):
                  print(f"[UNPACK] Đang giải nén gói logic '{archive}' tại thư mục gốc...")
                  if archive.endswith(".zip"):
                      with zipfile.ZipFile(archive, "r") as zf:
                          zf.extractall(".")
                  elif archive.endswith(".tar.gz") or archive.endswith(".tgz"):
                      with tarfile.open(archive, "r:gz") as tf:
                          tf.extractall(".")
                  break
          for fpath in glob.glob("scripts/*.sh") + glob.glob("scripts/*.py") + glob.glob("tests/*.py"):
              if os.path.isfile(fpath):
                  os.chmod(fpath, os.stat(fpath).st_mode | stat.S_IEXEC | stat.S_IXGRP | stat.S_IXOTH)
          PYEOF

      - name: Install Python Dependencies (python-chess, PyYAML, gdown)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Download Stage 1 Checkpoint & Built Binaries
        uses: actions/download-artifact@v4
        with:
          name: Stockfish-Ultimate-Duel-Checkpoint-Stage1
          path: .

      - name: Verify Restored Binaries & Hardware Environment
        run: |
          chmod +x scripts/build_engines.sh
          chmod +x build/bin/stockfish-pro build/bin/stockfish-universal || true
          SKIP_REBUILD_IF_PRESENT=true ./scripts/build_engines.sh

      - name: Resume Multi-Core Hardware-Pinned Tournament — Stage 2 (Remaining ${{ needs.stage1_tournament.outputs.stage2_minutes }}p Play Time)
        run: |
          python3 scripts/tournament.py \
            --stage 2 \
            --resume \
            --pro-bin build/bin/stockfish-pro \
            --uni-bin build/bin/stockfish-universal \
            --results-dir results \
            --manifest results/build-manifest.json \
            --duration "${{ inputs.duration }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --move-time "${{ inputs.move_time }}" \
            --hash "${{ inputs.hash }}" \
            --threads "${{ inputs.threads }}"

      - name: Publish Final Summary to GitHub Step Summary
        if: always()
        run: |
          if [ -f results/summary.md ]; then
            cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Final Results Artifact (Stockfish-Ultimate-Duel-Results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stockfish-Ultimate-Duel-Results
          retention-days: 30
          if-no-files-found: error
          path: |
            results/matches.log
            results/matches.pgn
            results/matches.csv
            results/matches.jsonl
            results/summary.json
            results/summary.md
            results/build-manifest.json
            results/checkpoint.json
            results/experience.bin
